[project]
name = "sora-copilot-backend"
version = "0.1.0"
description = "SORA Copilot — EU drone Specific Operations Risk Assessment, computed by a symbolic rules engine"
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.120,<0.122",
  "uvicorn[standard]>=0.38,<0.40",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "python-multipart>=0.0.20,<0.1",
  "pyjwt[crypto]>=2.10,<3",
  "supabase>=2.32,<3",
  "clingo>=5.8,<6",
  # Phase 7 counterfactual optimisation. Pinned now so the image is proven to build
  # with the full dependency set rather than failing at the phase that needs it.
  "z3-solver>=5.3,<6",
  "shapely>=2.1,<3",
  "numpy>=2.1,<3",
  "pillow>=11,<12",
  "pyproj>=3.7,<4",
  "python-docx>=1.2,<2",
  "weasyprint>=66,<67",
  "anthropic>=0.75,<1",
  "stripe>=12,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.3,<2",
  "httpx>=0.28,<0.29",
  "ruff>=0.14,<0.15",
  "mypy>=1.18,<2",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# B008: FastAPI Depends() in defaults is the framework idiom.
# RUF001/2/3: the regulation's own notation — §, ×, ≤, →, m² — appears throughout.
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["clingo.*", "supabase.*", "shapely.*", "pyproj.*", "docx.*", "weasyprint.*"]
ignore_missing_imports = true
